services:
  db:
    shm_size: 1gb
    image: postgres:16
    container_name: olist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: olist-api
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     PGHOST: db
  #     PGPORT: "5432"
  #     PGDATABASE: postgres
  #     PGUSER: postgres
  #     PGPASSWORD: postgres
  #     PGSCHEMA: olist
  #   ports:
  #     - "8000:8000"

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    image: my-superset:pg
    container_name: superset
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "change_me_to_a_long_random_string_please"
      SUPERSET__SQLALCHEMY_DATABASE_URI: "postgresql+psycopg2://postgres:postgres@db:5432/postgres"
      ADMIN_USERNAME: admin
      ADMIN_FIRST_NAME: Superset
      ADMIN_LAST_NAME: Admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: superset
      SUPERSET_FEATURE_FLAGS: '{"SQLLAB_BACKEND_PERSISTENCE": true}'
      MAPBOX_API_KEY: "pk.eyJ1IjoiZG9lb2hqbiIsImEiOiJjbWd0NnBpN2MwMTMzMmpzZndqa2pzcm9vIn0._SDO3LjHUwQbVgSTY_Hvcg"
    volumes:
      - superset_home:/app/superset_home
    ports:
      - "8088:8088"
    command:
      - /bin/bash
      - -c
      - |
        set -e
        superset db upgrade
        superset fab create-admin \
          --username $${ADMIN_USERNAME} \
          --firstname $${ADMIN_FIRST_NAME} \
          --lastname $${ADMIN_LAST_NAME} \
          --email $${ADMIN_EMAIL} \
          --password $${ADMIN_PASSWORD} || true
        superset init
        gunicorn -w 2 -k gthread --threads 8 --timeout 300 -b 0.0.0.0:8088 'superset.app:create_app()'
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-data:/prometheus 
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"  
    ports:
      - "9090:9090"
    depends_on:
      - db
      - node_exporter
      - postgres_exporter
      - custom_exporter

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    pid: "host"
    ports:
      - "9100:9100"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      # внутри docker-сети база доступна по имени сервиса "db"
      DATA_SOURCE_NAME: postgresql://postgres:postgres@db:5432/postgres?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - db

  custom_exporter:
    build: ./exporters
    container_name: custom_exporter
    restart: unless-stopped
    command: ["python", "custom_exporter.py"]
    ports:
      - "9101:9101"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres

      WEATHER_API_KEY: "6bea3a864d4087d591a70398c28feb07"
      WEATHER_CITY: "Astana"   
    depends_on:
      - db

volumes:
  pgdata:
  superset_home:
  grafana_data: